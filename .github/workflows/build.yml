name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode dependencies
        working-directory: app/src/main/assets/nodejs-project
        run: npm install --production --no-optional

      - name: Download Node.js for Android (arm64)
        working-directory: app/src/main/assets/nodejs-project
        run: |
          NODE_VERSION="22.12.0"
          ARCH="arm64"
          mkdir -p nodejs
          curl -sL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-android-${ARCH}.tar.gz" \
            -o /tmp/node-android.tar.gz
          tar -xzf /tmp/node-android.tar.gz -C nodejs --strip-components=1
          chmod +x nodejs/bin/node
          ls -lh nodejs/bin/node
          rm -f /tmp/node-android.tar.gz

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-release
          path: app/build/outputs/apk/release/app-release.apk
